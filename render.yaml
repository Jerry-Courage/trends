services:
  - type: web
    name: trends-electronics
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install --include=dev && npm run build:render
    startCommand: node dist-server/index.cjs
    healthCheckPath: /api/health
    envVars:
      - key: NPM_CONFIG_PRODUCTION
        value: false
      - key: NODE_ENV
        value: production
      - key: RENDER
        value: true
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_SECRET
        value: trends-staff-2025
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: CJ_API_EMAIL
        sync: false
      - key: CJ_API_KEY
        sync: false
