<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Document Title -->
    <title>Trends Store | Global Sourced Goods & Online Shopping Ghana</title>
    <meta name="description" content="Welcome to Trends Store, the leading general e-commerce marketplace in Ghana. Shop best-selling items across fashion, home, electronics, and beauty with fast local delivery." />
    <meta name="keywords" content="trends store, trends ecommerce ghana, trends marketplace, online shopping accra, Ghana online market, trends ghana, online shopping store, global shipping shop, dropship store, worldwide delivery store, fashion, beauty, home products, local courier" />
    <meta name="author" content="Trends Team" />

    <!-- Open Graph Metadata -->
    <meta property="og:title" content="Trends Store | Global Sourced Goods & Online Shopping Ghana" />
    <meta property="og:description" content="Welcome to Trends Store, the leading general e-commerce marketplace in Ghana. Shop best-selling items across fashion, home, electronics, and beauty with fast local delivery." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Trends" />

    <!-- PWA Metadata -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FB570B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Trends" />

    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  </head>

  <body>
    <!-- Apply theme BEFORE React loads to prevent flash of wrong theme -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
  </body>
</html>
